design_task:
  description: >
    Take the high level requirements described here and prepare a detailed design for the engineer;
    everything should be in 1 python module, but outline the classes and methods in the module.
    Define explicit invariants for nonnegative cash and share holdings, and specify validation before any state mutation.
    Specify the account's cash, holdings, and transaction-history data structures, along with method inputs, outputs, and failure behavior.
    Describe how current share prices are retrieved and how portfolio value and profit or loss are calculated consistently.
    Here are the requirements: {requirements}
    IMPORTANT: Only output the design in markdown format, laying out in detail the classes and functions in the module, describing the functionality.
  expected_output: >
    A detailed design for the engineer, identifying the classes and functions in the module.
  agent: engineering_lead
  output_file: output/{module_name}_design.md

code_task:
  description: >
    Write a python module that implements the design described by the engineering lead, in order to achieve the requirements.
    Use Decimal or another exact decimal representation for cash and share prices; avoid binary floating-point arithmetic for financial balances.
    Validate that deposit and withdrawal amounts, share quantities, and quoted prices are finite and positive.
    Reject invalid or unaffordable transactions before mutating balances, holdings, or transaction history.
    Here are the requirements: {requirements}
  expected_output: >
    A python module that implements the design and achieves the requirements.
    IMPORTANT: Output ONLY the raw Python code without any markdown formatting, code block delimiters, or backticks.
    The output should be valid Python code that can be directly saved to a file and executed.
  agent: backend_engineer
  context:
    - design_task
  output_file: output/{module_name}

frontend_task:
  description: >
    Write a gradio UI in a module app.py that demonstrates the given backend class in {module_name}.
    Keep the UI simple, but isolate each browser session's account using Gradio session state (such as gr.State).
    Preserve the same account across interactions within a session without sharing a mutable global account between visitors.
    Pass updated account state through callbacks and return it after each transaction.
    Show clear success or failure messages for deposits, withdrawals, buys, and sells.
    Display current cash balance, holdings, portfolio value, and transaction history after each action.
    Handle invalid inputs and rejected transactions gracefully without resetting account state.
    Here are the requirements: {requirements}
  expected_output: >
    A gradio UI in module app.py that demonstrates the given backend class.
    The file should be ready so that it can be run as-is, in the same directory as the backend module, and it should import the backend class from {module_name}.
    IMPORTANT: Output ONLY the raw Python code without any markdown formatting, code block delimiters, or backticks.
    The output should be valid Python code that can be directly saved to a file and executed.
  agent: frontend_engineer
  context:
    - code_task
  output_file: output/app.py

test_task:
  description: >
    Write unit tests for the given backend module {module_name} and create a test_{module_name} in the same directory as the backend module.
    Cover successful deposits, withdrawals, buys, sells, portfolio valuation, and transaction history.
    Include failure cases for overdrafts, unaffordable purchases, and attempts to sell more shares than owned.
    Check that rejected operations do not change account balances, holdings, or transaction history.
    Test zero, negative, NaN, and infinite monetary inputs and share prices, and invalid share quantities.
    Include repeated buy/sell sequences to verify holdings never become negative and cash reconciles with recorded transactions.
    Use deterministic, locally stubbed share prices so tests never depend on live market data or network access.
    Keep each test independent with a fresh account fixture, and assert exact monetary values rather than approximate float comparisons.
    Cover unsupported ticker symbols and share-price lookup failures, including exceptions from the price provider.
    Verify failed lookups leave cash, holdings, and transaction history unchanged.
    Test the profit/loss calculation after both deposits and withdrawals, distinguishing net contributions from investment returns.
    Verify portfolio value equals available cash plus the market value of all holdings at the supplied prices.
  expected_output: >
    A test_{module_name} module that tests the given backend module.
    IMPORTANT: Output ONLY the raw Python code without any markdown formatting, code block delimiters, or backticks.
    The output should be valid Python code that can be directly saved to a file and executed.
  agent: test_engineer
  context:
    - code_task
  output_file: output/test_{module_name}